name: Financial Corporate Risk Tests

on:
  push:
    branches:
      - main
      - feature/financial-corporate-risk-command
    paths:
      - 'services/financial_corporate/**'
      - 'routes/financial_corporate_*.py'
      - 'tests/test_financial_corporate_*.py'
      - 'main.py'
      - 'app/main.py'
      - '.github/workflows/financial-corporate-tests.yml'
  pull_request:
    paths:
      - 'services/financial_corporate/**'
      - 'routes/financial_corporate_*.py'
      - 'tests/test_financial_corporate_*.py'
      - 'main.py'
      - 'app/main.py'
      - '.github/workflows/financial-corporate-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile financial corporate backend
        run: |
          python -m py_compile \
            services/financial_corporate/*.py \
            routes/financial_corporate_*.py

      - name: Test report generator
        run: python -m unittest tests.test_financial_corporate_report_generator -v

      - name: Calibrated hazard - old CVE freshness
        run: python -m unittest tests.test_financial_corporate_calibrated_hazards.CalibratedCorporateHazardTests.test_old_cve_modified_recently_does_not_count_as_current_pressure -v

      - name: Calibrated hazard - recent CVE
        run: python -m unittest tests.test_financial_corporate_calibrated_hazards.CalibratedCorporateHazardTests.test_recent_published_cve_counts_as_current_pressure -v

      - name: Calibrated hazard - victim attribution
        run: python -m unittest tests.test_financial_corporate_calibrated_hazards.CalibratedCorporateHazardTests.test_victim_attribution_rejects_supplier_incident_as_enterprise_incident -v

      - name: Run financial corporate test suite
        run: python -m unittest discover -s tests -p 'test_financial_corporate_*.py' -v
